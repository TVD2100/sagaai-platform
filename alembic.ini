# Alembic configuration of the SagaAI schema history.
#
# The revision chain is shared by both installation databases (sagaai.db and
# devagent.db): they hold the same ORM tables and differ only in the raw-SQL
# feature tables, which a revision creates for the main database alone. The
# database file and its kind therefore reach env.py through
# ``config.attributes`` (programmatic use) - never through this file, which
# stays free of a hardcoded path.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revision ids are numeric prefixes so a directory listing reads as history.
file_template = %%(rev)s_%%(slug)s
# A migration that fails must not leave a half-applied schema behind: the
# driver takes the snapshot and the upgrade runs one revision per transaction.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

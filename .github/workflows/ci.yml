# Continuous integration for the SagaAI platform.
#
# The workflow carries no checks of its own: it installs the dependencies and
# calls ``scripts/ci_check.py``, the same entry point a developer runs
# locally. Keeping the logic in one script is what makes "green locally" and
# "green in CI" mean the same thing - a check cannot be added to one place and
# forgotten in the other.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running job obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, manifest, lock and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # The environment is installed from the lock, not from the constraint
      # files: the lock carries the exact versions and their hashes that the
      # suite was proven against. A hash mismatch fails here instead of
      # surfacing as a mysterious test failure later.
      # ruff and pyright are CI tools, not platform dependencies: they are
      # installed here rather than locked, so a tool upgrade never changes
      # what the platform itself resolves to. ``pyright[nodejs]`` ships a
      # Node runtime in the wheel, which keeps the step reproducible without
      # a system node or a network download at check time. The pyright
      # version is pinned to the one the type budget was measured with
      # (``expected_tool`` in pyright_budget.json): an unpinned upgrade would
      # raise the error count and fail the gate without a code change.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install ruff "pyright[nodejs]==1.1.414"

      - name: Run the checks
        run: python scripts/ci_check.py
